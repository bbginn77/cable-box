<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Retro Cable Box</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo+Narrow:wght@500;600;700&family=Archivo:wght@700;800;900&display=swap" rel="stylesheet">
<style>
/* Layout: a 960x540 cable-box stage scaled to fit the TV frame, with an on-screen remote beside it (wide) or below it (narrow) */
:root{
  --navy:#06113d; --navy2:#0d2270; --panel:#16328a; --panelHi:#2348b0;
  --cell:#40389a; --cellNow:#2c58b8; --chan:#0f2466;
  --hi:#ffd21a; --hiText:#0b0b18; --ice:#a6d4ff; --text:#ffffff; --dim:#b9c7ef;
  --room:#0c0e14; --plastic:#1e2028; --plastic2:#2c2f39; --btn:#3a3e4a; --btnText:#e8eaf0;
  --red:#d8343a; --green:#2fae4f; --blue:#2f6fd8; --yellow:#e8c21b;
  --display:"Archivo","Arial Black",Helvetica,sans-serif;
  --ui:"Archivo Narrow","Arial Narrow",Helvetica,Arial,sans-serif;
  color-scheme:dark;
  --khi1:#ffe45c;--khi2:#f2c200;--khil:#fff6b8;--khid:#8a6c00;--khink:#5a4500;
  --k041040:#041040;--k050f3a:#050f3a;--k06123f:#06123f;--k061650:#061650;--k071a55:#071a55;--k081a58:#081a58;--k081a5c:#081a5c;--k082063:#082063;--k0a1a55:#0a1a55;--k0b2268:#0b2268;--k0b2569:#0b2569;--k0d2a7c:#0d2a7c;--k0e2780:#0e2780;--k0f2569:#0f2569;--k0f2672:#0f2672;--k10093a:#10093a;--k12318a:#12318a;--k143a96:#143a96;--k173586:#173586;--k173f9e:#173f9e;--k183689:#183689;--k1a1460:#1a1460;--k1a3a92:#1a3a92;--k1d3ea6:#1d3ea6;--k2148b4:#2148b4;--k2348b0:#2348b0;--k24164f:#24164f;--k2a4aa4:#2a4aa4;--k2a4fae:#2a4fae;--k2a4fb4:#2a4fb4;--k2a58c0:#2a58c0;--k2a62c9:#2a62c9;--k5b44b0:#5b44b0;--k6f9cf0:#6f9cf0;--k7fa8f5:#7fa8f5;--k86acf4:#86acf4;--k8a80e0:#8a80e0;--k8fb3f5:#8fb3f5;--k9ec0ff:#9ec0ff;--kc9c4ff:#c9c4ff;--kdfe8ff:#dfe8ff;--ke6ecff:#e6ecff;--kwxnow:rgba(6,20,80,.55);
}
body{background:var(--room);color:var(--text);font-family:var(--ui);
  padding-left:max(16px, env(safe-area-inset-left,0px));padding-right:max(16px, env(safe-area-inset-right,0px));padding-block:16px}
.app{display:grid;grid-template-columns:minmax(0,1fr) 210px;gap:18px;max-width:1380px;margin:0 auto;align-items:start}
@media (max-width:760px),(max-aspect-ratio:1/1){.app{grid-template-columns:minmax(0,1fr)}}
.tvframe{background:linear-gradient(#25272e,#121318);border-radius:14px;padding:12px 12px 8px;box-shadow:0 18px 50px rgba(0,0,0,.6),inset 0 1px 0 #3a3d47}
.screen{position:relative;width:100%;aspect-ratio:16/9;max-width:100%;overflow:hidden;background:#000;border-radius:3px}
.under{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:8px 4px 2px;color:#7d8394;font-size:12px;letter-spacing:.08em;text-transform:uppercase}
.under button{background:none;border:1px solid #3a3d47;color:#aab0bf;font:600 12px var(--ui);letter-spacing:.08em;text-transform:uppercase;padding:4px 10px;border-radius:4px;cursor:pointer}
.led{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3cff6b;box-shadow:0 0 6px #3cff6b;margin-right:6px;vertical-align:1px}
#stage{position:absolute;left:0;top:0;width:960px;height:540px;transform-origin:0 0;font-family:var(--ui);user-select:none;-webkit-user-select:none}
#video{position:absolute;inset:0;width:960px;height:540px;display:block}
#ui{position:absolute;inset:0}
.tvframe:fullscreen{padding:0;border-radius:0;display:flex;align-items:center;background:#000}
.tvframe:fullscreen .under{display:none}
.tvframe:fullscreen .screen{height:100%;aspect-ratio:auto;border-radius:0}

/* ---------- cable-box UI (stage coordinates) ---------- */
.bg{position:absolute;inset:0;background:linear-gradient(180deg,var(--k0e2780) 0%,var(--k081a5c) 45%,var(--k050f3a) 100%)}
.hdr{position:absolute;left:0;right:0;top:0;height:46px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;
  background:linear-gradient(var(--k1d3ea6),var(--k0f2672));border-bottom:2px solid var(--k6f9cf0);box-shadow:0 2px 0 var(--k041040)}
.brand{display:flex;align-items:baseline;gap:8px}
.brand b{font:900 21px var(--display);letter-spacing:-.01em;font-style:italic;color:#fff;text-shadow:2px 2px 0 var(--k041040)}
.brand .cat{align-self:center;flex:none;filter:drop-shadow(2px 2px 0 var(--k041040))}
.brand span{font:700 12px var(--ui);letter-spacing:.22em;color:var(--ice)}
.hdr .title{font:800 var(--tsz,19px) var(--display);letter-spacing:.06em;text-transform:uppercase;text-shadow:2px 2px 0 var(--k041040)}
.clk{font:700 19px var(--ui);text-shadow:2px 2px 0 var(--k041040);font-variant-numeric:tabular-nums}
.ftr{position:absolute;left:0;right:0;bottom:0;height:34px;display:flex;align-items:center;gap:22px;padding:0 22px;background:var(--k06123f);border-top:2px solid var(--k2a4fae);font:600 15px var(--ui);color:var(--dim)}
.ftr i{font-style:normal;display:inline-block;min-width:22px;padding:1px 6px;margin-right:6px;border:1px solid var(--k6f9cf0);border-radius:3px;color:#fff;background:var(--k173586);text-align:center;font-weight:700}
.dot{display:inline-block;width:12px;height:12px;border-radius:50%;margin-right:6px;vertical-align:-1px;border:1px solid rgba(255,255,255,.5)}
.bevel{border:2px solid;border-color:var(--k7fa8f5) var(--k0a1a55) var(--k0a1a55) var(--k7fa8f5)}
.pv{background:#000;position:relative}
.pv canvas{width:100%;height:100%;display:block}

/* menu list */
.menu{position:absolute;display:flex;flex-direction:column;gap:6px}
.mi{height:44px;display:flex;align-items:center;padding:0 16px;font:700 22px var(--ui);letter-spacing:.02em;background:linear-gradient(var(--k2348b0),var(--k173586));
  border:2px solid;border-color:var(--k86acf4) var(--k0a1a55) var(--k0a1a55) var(--k86acf4);color:#fff;text-shadow:1px 1px 0 var(--k041040);gap:12px}
.mi .n{font:800 15px var(--display);color:var(--ice);width:20px}
.mi.hi{background:linear-gradient(var(--khi1),var(--khi2));color:var(--hiText);text-shadow:none;border-color:var(--khil) var(--khid) var(--khid) var(--khil)}
.mi.hi .n{color:var(--khink)}
.mi .t{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mi .v{margin-left:auto;font-weight:600;font-size:19px}
.mi .star{margin-left:auto;color:var(--hi);font-size:20px}
.mi.hi .star{color:var(--khink)}
.box{position:absolute;background:linear-gradient(var(--k183689),var(--k0f2569));padding:16px 18px}
.box h3{margin:0 0 8px;font:800 22px var(--display);letter-spacing:.01em}
.box p{margin:0 0 8px;font:500 17px/1.35 var(--ui);color:var(--dim)}
.lbl{font:700 13px var(--ui);letter-spacing:.18em;text-transform:uppercase;color:var(--ice)}

/* guide */
.ginfo{position:absolute;left:12px;right:12px;top:54px;height:152px;display:flex;gap:14px}
.ginfo .pv{width:256px;height:144px;flex:none}
.gtext{flex:1;min-width:0;background:linear-gradient(var(--k183689),var(--k0f2569));padding:10px 16px;overflow:hidden}
.gtext h2{margin:0 0 4px;font:800 26px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gmeta{font:700 16px var(--ui);color:var(--ice);margin-bottom:6px;display:flex;gap:14px;flex-wrap:wrap}
.rate{border:1px solid var(--ice);padding:0 5px;border-radius:2px}
.cab{display:inline-block;vertical-align:middle;flex:none}
.gtext p{margin:0;font:500 16px/1.32 var(--ui);color:var(--dim)}
.rem{color:var(--hi)}
.trow{position:absolute;left:12px;right:12px;top:214px;height:28px;display:flex;font:700 16px var(--ui)}
.trow .d{width:150px;flex:none;background:var(--k081a58);display:flex;align-items:center;padding-left:10px;color:var(--hi)}
.trow .s{flex:1;background:linear-gradient(var(--k2a4fb4),var(--k1a3a92));border-left:2px solid var(--k0a1a55);display:flex;align-items:center;padding-left:10px}
.grid{position:absolute;left:12px;right:12px;top:244px}
.grow{position:relative;height:38px;margin-bottom:3px}
.gch{position:absolute;left:0;top:0;width:148px;height:38px;background:var(--chan);border:1px solid var(--k2a4aa4);display:flex;align-items:center;gap:8px;padding:0 8px;box-sizing:border-box}
.gch b{font:800 19px var(--display);width:36px;text-align:right;font-variant-numeric:tabular-nums}
.gch span{font:700 16px var(--ui);color:var(--ice);letter-spacing:.04em}
.gch .fv{margin-left:auto;color:var(--hi);font-size:14px}
.grow.cur .gch{background:var(--k2a4fb4)}
.cell{position:absolute;top:0;height:38px;box-sizing:border-box;background:var(--cell);border:1px solid;border-color:var(--k8a80e0) var(--k1a1460) var(--k1a1460) var(--k8a80e0);
  display:flex;align-items:center;padding:0 9px;font:700 17px var(--ui);white-space:nowrap;overflow:hidden;text-shadow:1px 1px 0 var(--k10093a)}
.cell.now{background:var(--cellNow);border-color:var(--k8fb3f5) var(--k0a1a55) var(--k0a1a55) var(--k8fb3f5);text-shadow:1px 1px 0 var(--k041040)}
.cell.hi{background:linear-gradient(var(--khi1),var(--khi2));color:var(--hiText);text-shadow:none;border-color:var(--khil) var(--khid) var(--khid) var(--khil)}
.cell .ar{color:var(--ice);margin-right:5px;font-size:13px}
.cell.hi .ar{color:var(--khink)}
.cell .rm{margin-left:6px;color:var(--hi)}
.cell.hi .rm{color:var(--khink)}
.lockedrow .cell{color:var(--kc9c4ff)}
.grow.pl .gch{background:var(--k24164f);border-color:var(--k5b44b0)}
.grow.pl .gch b{font-size:16px;width:34px}
.grow.pl .gch span{font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:92px}

/* watch banner */
.banner{position:absolute;left:24px;right:24px;bottom:22px;height:118px;display:flex;background:linear-gradient(var(--k2148b4) 0%,var(--k12318a) 55%,var(--k0b2268) 100%);
  border:2px solid;border-color:var(--k9ec0ff) var(--k061650) var(--k061650) var(--k9ec0ff);box-shadow:0 6px 0 rgba(0,0,0,.35)}
.banner .num{width:150px;flex:none;display:flex;flex-direction:column;align-items:center;justify-content:center;background:linear-gradient(var(--k0d2a7c),var(--k071a55));border-right:2px solid var(--k061650)}
.banner .num b{font:900 52px/1 var(--display);color:var(--hi);text-shadow:3px 3px 0 #000;font-variant-numeric:tabular-nums}
.banner .num span{font:700 17px var(--ui);letter-spacing:.14em;margin-top:4px}
.banner .mid{flex:1;min-width:0;padding:10px 16px}
.banner h2{margin:0;font:800 26px var(--display);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;text-shadow:2px 2px 0 var(--k041040)}
.banner .meta{font:700 16px var(--ui);color:var(--ice);margin:3px 0 7px;display:flex;gap:14px}
.prog{height:8px;background:var(--k061650);border:1px solid var(--k7fa8f5);width:340px}
.prog div{height:100%;background:var(--hi)}
.banner .next{font:600 15px var(--ui);color:var(--dim);margin-top:7px}
.banner .rt{width:150px;flex:none;padding:10px 14px;text-align:right;display:flex;flex-direction:column;justify-content:space-between}
.banner .rt .clk{font-size:22px}
.entry{position:absolute;right:30px;top:24px;font:900 48px var(--display);color:var(--hi);text-shadow:3px 3px 0 #000;letter-spacing:.06em}
.lock{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.lock .box{position:static;width:460px;text-align:center}

/* dialog */
.dlg{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:520px;background:linear-gradient(var(--k183689),var(--k0f2569));border:2px solid;border-color:var(--k9ec0ff) var(--k061650) var(--k061650) var(--k9ec0ff);box-shadow:0 10px 0 rgba(0,0,0,.45)}
.dlg .t{background:linear-gradient(var(--khi1),var(--khi2));color:var(--hiText);font:800 19px var(--display);padding:8px 14px;letter-spacing:.02em}
.dlg .b{padding:16px 18px;font:500 18px/1.4 var(--ui);color:var(--ke6ecff)}
.dlg .b small{display:block;margin-top:10px;font-size:15px;color:var(--dim)}
.wait{display:inline-block;width:14px;height:14px;border:3px solid var(--ice);border-right-color:transparent;border-radius:50%;animation:sp 1s steps(8) infinite;vertical-align:-2px;margin-right:8px}
@keyframes sp{to{transform:rotate(360deg)}}

/* weather */
.wx{position:absolute;inset:0;background:linear-gradient(180deg,var(--k2a62c9) 0%,var(--k173f9e) 40%,var(--k0b2569) 100%)}
.wxh{position:absolute;left:30px;top:22px;right:30px;display:flex;justify-content:space-between;align-items:center}
.wxh b{font:900 30px var(--display);font-style:italic;text-shadow:3px 3px 0 var(--k082063)}
.wxnow{position:absolute;left:30px;top:84px;width:380px;height:240px;background:var(--kwxnow);border:2px solid var(--k9ec0ff);padding:16px 20px;box-sizing:border-box}
.wxnow .tmp{font:900 92px/1 var(--display);text-shadow:4px 4px 0 var(--k061650)}
.wxnow .cond{font:800 24px var(--display);color:var(--hi);margin:6px 0 10px}
.wxnow .row{font:600 17px var(--ui);color:var(--kdfe8ff);display:flex;justify-content:space-between;margin-top:3px}
.wxdays{position:absolute;left:430px;right:30px;top:84px;height:240px;display:grid;grid-template-columns:repeat(5,1fr);gap:8px}
.wxd{background:linear-gradient(var(--k2a58c0),var(--k143a96));border:2px solid;border-color:var(--k9ec0ff) var(--k061650) var(--k061650) var(--k9ec0ff);text-align:center;padding:10px 4px;display:flex;flex-direction:column;align-items:center;gap:6px}
.wxd .dn{font:800 18px var(--display);color:var(--hi)}
.wxd .hi2{font:900 30px var(--display)}
.wxd .lo{font:700 18px var(--ui);color:var(--ice)}
.wxd .c{font:600 14px var(--ui);color:var(--kdfe8ff)}
.ticker{position:absolute;left:0;right:0;bottom:34px;height:38px;background:var(--k061650);border-top:2px solid var(--hi);overflow:hidden;white-space:nowrap}
.ticker.alert{border-top-color:#ff4d4d;background:#4a0b12}
.ticker div{display:inline-block;padding-left:100%;font:700 19px/38px var(--ui);animation:tk 26s linear infinite}
@keyframes tk{to{transform:translateX(-100%)}}
.sample{position:absolute;left:30px;top:336px;font:600 14px var(--ui);color:var(--ice);letter-spacing:.1em;text-transform:uppercase}

/* ---------- remote ---------- */
.remote{background:linear-gradient(90deg,#17191f,var(--plastic) 30%,var(--plastic2) 70%,#17191f);border-radius:36px 36px 46px 46px;padding:20px 18px 22px;
  box-shadow:0 14px 40px rgba(0,0,0,.6),inset 0 1px 0 #444855;display:flex;flex-direction:column;gap:14px;max-width:240px;margin:0 auto;width:100%;box-sizing:border-box}
.rrow{display:flex;justify-content:space-between;gap:8px}
.rb{flex:1;background:linear-gradient(#4a4f5d,var(--btn));color:var(--btnText);border:none;border-radius:8px;padding:8px 0;font:700 12px var(--ui);letter-spacing:.08em;cursor:pointer;
  box-shadow:0 2px 0 #0b0c10,inset 0 1px 0 rgba(255,255,255,.15);touch-action:manipulation}
.rb:active,.rb.press{transform:translateY(2px);box-shadow:0 0 0 #0b0c10}
.rb:focus-visible{outline:2px solid var(--hi);outline-offset:2px}
.rb.menu{background:linear-gradient(#3f6fd6,#24489e)}
.rb.guide{background:linear-gradient(#e2c13a,#b8930f);color:#1a1400}
.dpad{position:relative;width:160px;height:160px;margin:0 auto;border-radius:50%;background:radial-gradient(circle at 50% 40%,#4a4f5d,#2a2d36);box-shadow:0 3px 0 #0b0c10,inset 0 1px 0 rgba(255,255,255,.12)}
.dpad .rb{position:absolute;border-radius:6px;background:transparent;box-shadow:none;font-size:18px;color:#cfd3dd;width:50px;height:46px;padding:0}
.dpad .u{left:55px;top:4px}.dpad .d{left:55px;bottom:4px}.dpad .l{left:4px;top:57px;width:46px;height:46px}.dpad .r{right:4px;top:57px;width:46px;height:46px}
.dpad .ok{left:47px;top:47px;width:66px;height:66px;border-radius:50%;background:linear-gradient(#5b6170,#3a3e4a);box-shadow:0 2px 0 #0b0c10;font-size:15px;color:#fff}
.chv{display:flex;gap:10px;align-items:stretch}
.chv .stack{display:flex;flex-direction:column;gap:6px;width:56px}
.chv .stack .rb{padding:10px 0}
.keys{flex:1;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.keys .rb{padding:7px 0;font-size:14px}
.hint{font:500 12px/1.5 var(--ui);color:#80869a;text-align:center;letter-spacing:.02em}
@media (max-width:760px),(max-aspect-ratio:1/1){
  .remote{max-width:420px;display:grid;grid-template-columns:1fr 1fr;align-items:center;border-radius:28px}
  .remote .rrow,.remote .hint{grid-column:1 / -1}
  .dpad{grid-column:1;grid-row:2 / span 2}
  .chv{grid-column:2}
}
/* holiday decorations (only while a holiday theme is active) */
.deco{display:none;position:absolute;pointer-events:none}
.themed .deco{display:block}
.bg .deco{opacity:.16}
.hdr .deco{position:static;display:none}
.themed .hdr .deco{display:inline-block}
.hdrmid{display:flex;align-items:center;gap:10px}
.emo{font-family:"Noto Color Emoji","Apple Color Emoji","Segoe UI Emoji",sans-serif;line-height:1;display:inline-block}
.emo.txt{font-family:var(--display);font-weight:900;color:var(--hi)}
/* metro Atlanta radar channel */
.rfull{position:absolute;inset:0;background:#0a0d12}
.rfull img,.rfull canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:contain}
.rtop{position:absolute;left:0;right:0;top:0;height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 22px;background:linear-gradient(var(--k1d3ea6),var(--k0f2672));border-bottom:2px solid var(--k6f9cf0)}
.rtop b{font:900 20px var(--display);letter-spacing:.04em;text-transform:uppercase;text-shadow:2px 2px 0 var(--k041040)}
.rbot{position:absolute;left:22px;bottom:20px;display:flex;gap:10px;align-items:center;padding:8px 14px;background:var(--kwxnow);border:2px solid var(--k9ec0ff);font:700 16px var(--ui)}
.rbot .mus{color:var(--hi)}
.boot{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px}
.blogo{display:flex;align-items:center;gap:18px}
.blogo b{display:block;font:italic 900 58px var(--display);text-shadow:4px 4px 0 var(--k041040)}
.blogo span{display:block;font:700 16px var(--ui);letter-spacing:.4em;color:var(--ice);margin-top:2px}
.blogo .cat{filter:drop-shadow(4px 4px 0 var(--k041040))}
.bmsg{font:700 22px var(--ui);min-height:28px}
.bbar{width:420px;height:16px;border:2px solid var(--k9ec0ff);background:var(--k061650);padding:2px}
.bbar div{height:100%;width:0;background:linear-gradient(var(--khi1),var(--khi2))}
.bfoot{position:absolute;left:30px;right:30px;bottom:26px;display:flex;justify-content:space-between;align-items:center;font:600 15px var(--ui);color:var(--dim)}
.bled{font:700 30px "DejaVu Sans Mono",Consolas,monospace;color:#ff3b2f;text-shadow:0 0 8px rgba(255,59,47,.8);background:#120404;padding:2px 12px;border:2px solid #333;letter-spacing:.08em;min-width:110px;text-align:center}
.bskip{position:absolute;right:30px;top:24px;font:600 14px var(--ui);color:var(--dim)}
/* holiday themes screen */
.sw{display:inline-block;width:26px;height:26px;border:2px solid rgba(255,255,255,.6);margin-right:6px}
.motifs{font-size:40px;display:flex;gap:14px;margin:10px 0 14px}
.ftr .deco{position:static;margin-left:auto}
.themed .ftr .deco{display:flex;gap:6px;align-items:flex-end}
/* main menu weather widgets */
.radar{position:absolute;overflow:hidden;background:#0b0f14}
.radar img,.radar canvas{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:50% 45%}

function locked(ci){return has(ci)&&SET.parental&&!!CH[ci].mature}
// channels you can flip through in full screen (the box's own)
function has(ci){return ci>=0&&ci<CH.length}
function isFav(ci){return has(ci)&&FAV.has(CH[ci].key)}
function favFilter(L){return (SET.guideFav&&L.some(isFav))?L.filter(isFav):L}
function allList(){const L=[];for(let i=0;i<CH.length;i++)L.push(i);return L}
function surfList(){return favFilter(allList().filter(i=>!CH[i].pluto||SET.plutoPlay==='box'||!NATIVE))}
// rows in the guide: your channels plus Pluto TV rows
function guideList(){return favFilter(allList())}
function esc(s){return String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]))}

function T(s){let r=(SET.lang&&I18N[SET.lang]&&I18N[SET.lang][s])||s;for(let i=1;i<arguments.length;i++)r=r.split('{'+(i-1)+'}').join(arguments[i]);return r}
// translate the text between tags of a finished screen, so data labels and holiday names follow the language
function trText(t){const D=I18N[SET.lang];if(!D)return t;if(D[t])return D[t];
  const m=t.match(/^([\s◀▶★⏰♪·•:]*)(.*?)([\s◀▶★⏰♪·•:]*)$/);
  if(m&&m[2]&&D[m[2]])return m[1]+D[m[2]]+m[3];return t}
function trHTML(h){if(!I18N[SET.lang])return h;return h.replace(/>([^<>]+)</g,(m,t)=>'>'+trText(t)+'<')}

const isCA=()=>SET.region==='ca';

function tune(ci){
  if(!has(ci))return;
  try{localStorage.setItem('cablebox-lastch',CH[ci].key)}catch(e){}
  if(ci===S.ch){S.bannerUntil=Date.now()+SET.bannerSec*1000;render();return}
  S.last=S.ch;S.ch=ci;S.staticUntil=performance.now()+(CH[ci].pluto?500:260);S.bannerUntil=Date.now()+SET.bannerSec*1000;snd.ch();render();applyStream();
}
function chStep(dir){const L=surfList();if(!L.length){snd.bump();return}let p=L.indexOf(S.ch);if(p<0)p=0;p=(p+dir+L.length)%L.length;tune(L[p])}

function go(screen){S.prev=S.screen;S.screen=screen;if(screen==='guide')initGuide();if(screen==='watch')S.bannerUntil=Date.now()+SET.bannerSec*1000;render()}

/* ---------------- guide ---------------- */
const ROWS=6, WIN=90*MIN;
function initGuide(){const L=guideList();let row=L.indexOf(S.ch);if(row<0)row=0;const now=Date.now();
  S.g={row:row,top:Math.max(0,Math.min(row-2,L.length-ROWS)),win:floor30(now),ft:now}}
function gFocus(){const L=guideList();if(!L.length)return null;const ci=L[S.g.row];return {ci:ci,p:progAt(ci,Math.max(S.g.ft,S.g.win))}}
function guideKey(k){
  const L=guideList(),g=S.g;
  if(!L.length){snd.bump();return}
  if(g.row>=L.length){g.row=L.length-1}
  if(k==='up'||k==='down'||k==='chup'||k==='chdn'){
    const step=k==='up'?-1:k==='down'?1:k==='chup'?-ROWS:ROWS;
    const nr=Math.max(0,Math.min(L.length-1,g.row+step));if(nr===g.row){snd.bump();return}
    g.row=nr;if(g.row<g.top)g.top=g.row;if(g.row>=g.top+ROWS)g.top=g.row-ROWS+1;
    // keep focus time inside the newly focused program so up/down feels natural
    snd.nav();render();return;
  }
  if(k==='right'){const f=gFocus();if(f.p.end>Date.now()+24*3600000){snd.bump();return}
    g.ft=f.p.end;while(g.ft>=g.win+WIN)g.win+=SLOT;snd.nav();render();return}
  if(k==='left'){const f=gFocus();const nt=Math.max(f.p.start,g.win)-1;const minT=floor30(Date.now());
    if(nt<minT){snd.bump();return}
    while(nt<g.win)g.win-=SLOT;const pp=progAt(f.ci,nt);g.ft=Math.max(pp.start,g.win);snd.nav();render();return}
  if(k==='ok'){const f=gFocus();const now=Date.now();
    if(f.p.start<=now&&f.p.end>now){snd.ok();if(CH[f.ci].pluto&&SET.plutoPlay!=='box'){launchPluto(f.ci)}else{S.screen='watch';tune(f.ci);}}
    else{const key=f.ci+':'+f.p.start;if(S.reminders.has(key)){S.reminders.delete(key);dialog('Reminder Cleared',T('{0} on Ch {1}.',esc(f.p.title),CH[f.ci].n),1600)}
      else{S.reminders.add(key);dialog('Reminder Set',T('We’ll remind you when {0} starts at {1} on Ch {2}.','<b>'+esc(f.p.title)+'</b>',fmtT(f.p.start),CH[f.ci].n),2000)}snd.ok()}
    return}
  if(k==='fav'){const f=gFocus();toggleFav(f.ci);return}
}
function toggleFav(ci){if(!has(ci))return;const k=CH[ci].key;if(FAV.has(k))FAV.delete(k);else FAV.add(k);save();snd.ok();render()}

let dlgT=0;
function dialog(title,body,ms){S.dialog={title:title,body:body};clearTimeout(dlgT);if(ms)dlgT=setTimeout(()=>{S.dialog=null;render()},ms);render()}
function launch(app){
  if(NATIVE){
    if(app.sys){NATIVE.openSettings();return}
    if(!app.pkg){dialog(T('{0} Not Found',esc(app.label)),T('{0} isn’t installed on this Google TV.',esc(app.label))+'<small>Press OK to open Google Play, or BACK to cancel.</small>');S.dialog.onOk=()=>NATIVE.openStore(app.pkgs?app.pkgs[0]:'');return}
    dialog(esc(app.label),'<span class="wait"></span>Starting <b>'+esc(app.label)+'</b>…',1500);
    setTimeout(()=>{try{NATIVE.launchApp(app.pkg)}catch(e){}},350);return;
  }
  dialog(esc(app.label),'<span class="wait"></span>Starting <b>'+esc(app.label)+'</b>…<small>Prototype: on your Google TV this opens the real app. Press BACK to return here.</small>',2600);
}

/* ---------------- input ---------------- */
let entryT=0;
function press(k){
  if(S.screen==='boot'){if(k==='ok'&&performance.now()-BOOTSEQ.t0>800)endBoot();return}
  if(S.screen==='egg'){if(performance.now()-EGG.t0>800)go('set');return}
  try{if(AC&&AC.state==='suspended')AC.resume()}catch(e){}
  if(S.dialog){if(k==='ok'||k==='back'){const f=(k==='ok')&&S.dialog.onOk;S.dialog=null;clearTimeout(dlgT);snd.back();render();if(f)f()}return}
  if(/^[0-9]$/.test(k)){
    S.entry=(S.entry+k).slice(-3);snd.nav();
    if(S.screen!=='watch'){S.screen='watch'}
    clearTimeout(entryT);
    entryT=setTimeout(()=>{const n=parseInt(S.entry,10);S.entry='';let best=0,bd=1e9;surfList().forEach(i=>{const d=Math.abs(CH[i].n-n);if(d<bd){bd=d;best=i}});tune(best)},1300);
    render();return;
  }
  if(k==='menu'){if(S.screen==='home'){snd.back();go('watch')}else{snd.ok();go('home')}return}
  if(k==='guide'){if(S.screen==='guide'){snd.back();go('watch')}else{snd.ok();go('guide')}return}
  if(k==='last'){snd.ok();const l=S.last;if(S.screen!=='watch')S.screen='watch';tune(l);return}
  const sc=S.screen;
  if(k==='back'){snd.back();if(sc==='watch'){tune(S.last);return}
    if(sc==='home'){if(TOUCH&&NATIVE&&NATIVE.exitApp){NATIVE.exitApp();return}go('watch');return} if(sc==='wx'||sc==='more'){go('apps');return} if(sc==='themes'){go('set');return} if(sc==='guide'){go('watch');return} go('home');return}
  if(sc==='watch'){
    if(k==='up'||k==='chup'){chStep(1);return} if(k==='down'||k==='chdn'){chStep(-1);return}
    if(k==='ok'&&has(S.ch)&&CH[S.ch].radar){SET.jazz=!SET.jazz;save();snd.ok();updateJazz();render();setTimeout(()=>{if(S.screen==='watch')render()},1200);return}
    if(k==='ok'&&Date.now()<S.bannerUntil&&!locked(S.ch)){snd.ok();go('guide');return}
    if(k==='ok'||k==='info'){snd.nav();S.bannerUntil=Date.now()+SET.bannerSec*1000;render();return}
    if(k==='left'){snd.ok();go('home');return}
    if(k==='right'){snd.ok();go('guide');return}
    if(k==='fav'){toggleFav(S.ch);S.bannerUntil=Date.now()+SET.bannerSec*1000;render();return}
    return;
  }
  if(sc==='guide'){if(k==='info'){const f=gFocus();snd.nav();dialog(esc(f.p.title),esc(f.p.desc)+'<small>Ch '+CH[f.ci].n+' '+CH[f.ci].call+' · '+fmtT(f.p.start)+'–'+fmtT(f.p.end)+' · '+f.p.rating+'</small>');return}guideKey(k);return}
  if(sc==='wx'){return}
  if(sc==='egg'){if(performance.now()-EGG.t0>800){go('set')}return}
  if(sc==='themes'){const L=themeList();let i=S.idx.themes;
    if(k==='up'||k==='down'){const ni=i+(k==='up'?-1:1);if(ni<0||ni>=L.length){snd.bump();return}S.idx.themes=ni;snd.nav();render();return}
    if(k==='chup'||k==='chdn'){S.idx.themes=Math.max(0,Math.min(L.length-1,i+(k==='chup'?-8:8)));snd.nav();render();return}
    if(k==='left'||k==='right'||k==='ok'){const it=L[i];
      if(it.master)SET.themesOn=!SET.themesOn;
      else{const order=['auto','off','force'],st=themeState(it.id);let j=(order.indexOf(st)+(k==='left'?-1:1)+3)%3;
        SET.themeState=Object.assign({},SET.themeState);
        if(order[j]==='force')Object.keys(SET.themeState).forEach(id=>{if(SET.themeState[id]==='force')delete SET.themeState[id]});
        if(order[j]==='auto')delete SET.themeState[it.id];else SET.themeState[it.id]=order[j];}
      save();snd.nav();applyTheme();render();return}
    return}
  // list screens
  const lists={home:HOME,apps:APPS,od:OD,my:CH,set:SETS,more:moreList()};const list=lists[sc];if(!list)return;
  let i=S.idx[sc];
  if(k==='up'||k==='down'){const ni=i+(k==='up'?-1:1);if(ni<0||ni>=list.length){snd.bump();return}S.idx[sc]=ni;snd.nav();render();return}
  if(k==='chup'||k==='chdn'){S.idx[sc]=Math.max(0,Math.min(list.length-1,i+(k==='chup'?-5:5)));snd.nav();render();return}
  const it=list[i];
  if(sc==='set'&&(k==='left'||k==='right'||k==='ok')){
    if(it.action&&it.k==='update'){if(k!=='ok')return;snd.ok();if(UPD.state==='available')askUpdate();else checkUpdate(true);return}
    if(it.action&&it.k==='about'){if(k!=='ok')return;const now=Date.now();EGGC.n=(now-EGGC.t<1600)?EGGC.n+1:1;EGGC.t=now;snd.nav();if(EGGC.n>=5){EGGC.n=0;startEgg()}else render();return}
    if(it.action&&it.k==='themes'){if(k!=='ok'&&k!=='right')return;snd.ok();S.idx.themes=0;go('themes');return}
    if(it.action){if(k!=='ok')return;SET=Object.assign({},DEF,{themeState:{}});FAV=DEF_FAV();save();applyTheme();snd.ok();dialog('Settings Restored','All settings and favorites are back to their defaults.',1800);return}
    let vi=it.vals.indexOf(SET[it.k]);vi=(vi+(k==='left'?-1:1)+it.vals.length)%it.vals.length;SET[it.k]=it.vals[vi];save();snd.nav();render();if(it.k==='pluto'||it.k==='plutoCount')loadPluto();if(it.k==='plutoPlay'||it.k==='guideFav')applyStream();if(it.k==='jazz')updateJazz();if(it.k==='region'){applyTheme();render()}
    if(it.k==='lang'){document.documentElement.lang=SET.lang;radarLbl.textContent=radarFail?T(NATIVE?'RADAR OFFLINE \u00B7 SAMPLE':'SAMPLE RADAR'):T('LIVE RADAR')+' \u00B7 '+RADARS[radarIdx];render()}return}
  if(k==='ok'||k==='right'){
    if(sc==='home'){snd.ok();go(it.to);return}
    if(sc==='apps'){snd.ok();if(it.wx){go('wx')}else if(it.more){S.idx.more=0;go('more')}else launch(it);return}
    if(sc==='od'){snd.ok();launch(appByLabel(it.app)||{label:it.app});return}
    if(sc==='more'){snd.ok();launch(it);return}
    if(sc==='my'&&k==='ok'){toggleFav(i);return}
  }
  if(k==='fav'&&sc==='my'){toggleFav(i);return}
  if(k==='left'){snd.back();go('home')}
}
document.addEventListener('keydown',e=>{
  if(window.CableNative)return;
  const map={ArrowUp:'up',ArrowDown:'down',ArrowLeft:'left',ArrowRight:'right',Enter:'ok',' ':'ok',Escape:'back',Backspace:'back',
    m:'menu',M:'menu',g:'guide',G:'guide',i:'info',I:'info',l:'last',L:'last',f:'fav',F:'fav',PageUp:'chup',PageDown:'chdn','+':'chup','-':'chdn',
    MediaTrackNext:'chup',MediaTrackPrevious:'chdn',ContextMenu:'menu',GoBack:'back',BrowserBack:'back'};
  let k=map[e.key];if(!k&&/^[0-9]$/.test(e.key))k=e.key;
  if(e.keyCode===461)k='back'; // LG webOS back
  if(e.keyCode===10009)k='back'; // Samsung Tizen return
  if(!k)return;e.preventDefault();press(k);
});

function drawRadarSample(ctx,t,w,h){w=w||288;h=h||216;ctx.save();ctx.scale(w/288,h/216);w=288;h=216;ctx.fillStyle='#1b2433';ctx.fillRect(0,0,w,h);ctx.strokeStyle='#3c4b66';ctx.lineWidth=1;
  for(let i=0;i<7;i++){ctx.beginPath();ctx.moveTo(i*48,0);ctx.lineTo(i*48+20,h);ctx.stroke()}ctx.beginPath();ctx.moveTo(0,90);ctx.bezierCurveTo(90,70,180,120,288,96);ctx.stroke();
  const blobs=[['#3fd36b',46],['#e8d53a',24],['#e2493a',10]];for(let j=0;j<3;j++){const bx=((t*10+j*120)%420)-60,by=60+j*48;blobs.forEach(([cl,r])=>{const gr=ctx.createRadialGradient(bx,by,0,bx,by,r);gr.addColorStop(0,cl);gr.addColorStop(1,'rgba(0,0,0,0)');ctx.fillStyle=gr;ctx.beginPath();ctx.arc(bx,by,r,0,7);ctx.fill()})}ctx.restore()}

function menuHTML(list,sel,x,y,w,fmt,max){
  max=max||list.length;let start=Math.max(0,Math.min(sel-Math.floor(max/2),list.length-max));

}

function guideHTML(){
  const L=guideList(),g=S.g;
  if(!L.length)return '<div class="bg">'+bgDeco()+'</div>'+hdr('TV Guide')+'<div class="box bevel" style="left:200px;top:180px;width:520px"><h3>'+(PLUTO_ERR||!SET.pluto?'No Listings':'Loading Listings…')+'</h3><p>'+(!SET.pluto?'Turn on Pluto TV Listings in Settings to fill the guide.':PLUTO_ERR?esc(PLUTO_ERR):'Getting the Pluto TV lineup. This takes a few seconds.')+'</p></div>'+ftr(['<i>BACK</i>Exit']);
  if(g.row>=L.length)g.row=L.length-1;
  const f=gFocus(),now=Date.now(),c=CH[f.ci],p=f.p,remK=f.ci+':'+p.start;
  const onNow=p.start<=now&&p.end>now;
  let h='<div class="bg">'+bgDeco()+'</div>'+hdr('TV Guide')+
   '<div class="ginfo"><div class="pv bevel pv-slot"></div><div class="gtext bevel"><h2>'+esc(p.title)+'</h2>'+
   '<div class="gmeta"><span>'+fmtT(p.start)+' – '+fmtT(p.end)+'</span><span>Ch '+c.n+' '+esc(c.pluto?c.name:c.call)+'</span>'+rateHTML(p.rating)+''+(p.isNew?'<span>NEW</span>':'')+(S.reminders.has(remK)?'<span class="rem">⏰ Reminder</span>':'')+'</div>'+
   '<p>'+esc(p.desc)+'</p><p style="margin-top:6px;color:var(--hi);font-weight:700">'+(onNow?(c.pluto&&SET.plutoPlay!=='box'?'On now · Press OK to watch in Pluto TV':'On now · Press OK to watch'):'Press OK to set a reminder')+'</p></div></div>';
  const gw=936-150, ppm=gw/90;
  h+='<div class="trow"><div class="d">'+fmtDate(g.win)+'</div>';
  for(let s=0;s<3;s++)h+='<div class="s">'+fmtT(g.win+s*SLOT)+'</div>';
  h+='</div><div class="grid">';

    const ci=L[r],ch=CH[ci],lk=locked(ci);

    for(const pr of ch.sched){

      const x=150+(s-g.win)/MIN*ppm,w=(e-s)/MIN*ppm;
      const hi=(r===g.row&&pr===p),nw=pr.start<=now&&pr.end>now;
      h+='<div class="cell'+(hi?' hi':nw?' now':'')+'" data-r="'+r+'" data-st="'+pr.start+'" style="left:'+x.toFixed(1)+'px;width:'+(w-2).toFixed(1)+'px">'+
        (pr.start<g.win?'<span class="ar">◀</span>':'')+(lk?'Locked':esc(pr.title))+(S.reminders.has(ci+':'+pr.start)?'<span class="rm">⏰</span>':'')+(pr.end>g.win+WIN?'<span class="ar" style="margin-left:auto;padding-left:6px">▶</span>':'')+'</div>';
    }
    h+='</div>';
  }
  h+='</div>'+ftr(['<i>▲▼◀▶</i>Browse','<i>OK</i>'+(onNow?(c.pluto&&SET.plutoPlay!=='box'?'Open in Pluto TV':'Watch'):'Remind'),'<i>CH</i>Page','<span class="dot" style="background:var(--yellow)"></span>FAV ★','<i>INFO</i>Details']);
  return h;
}

function drawWxIcons(){
  ui.querySelectorAll('canvas.wxi').forEach(cv=>{const x=cv.getContext('2d'),c=cv.dataset.c;x.clearRect(0,0,64,52);
    const sun=(cx,cy,r)=>{x.fillStyle='#ffd21a';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.strokeStyle='#ffd21a';x.lineWidth=3;for(let a=0;a<8;a++){const t=a*Math.PI/4;x.beginPath();x.moveTo(cx+Math.cos(t)*(r+4),cy+Math.sin(t)*(r+4));x.lineTo(cx+Math.cos(t)*(r+9),cy+Math.sin(t)*(r+9));x.stroke()}};
    const moon=(cx,cy,r)=>{x.fillStyle='#f4f1c9';x.beginPath();x.arc(cx,cy,r,0,7);x.fill();x.globalCompositeOperation='destination-out';x.beginPath();x.arc(cx+6,cy-4,r-1,0,7);x.fill();x.globalCompositeOperation='source-over'};
    const cloud=(cx,cy,col)=>{x.fillStyle=col;x.beginPath();x.arc(cx-10,cy,10,0,7);x.arc(cx+4,cy-6,13,0,7);x.arc(cx+16,cy+2,9,0,7);x.rect(cx-10,cy,26,10);x.fill()};
    const rain=()=>{x.strokeStyle='#8fd0ff';x.lineWidth=3;for(let i=0;i<4;i++){x.beginPath();x.moveTo(20+i*8,36);x.lineTo(16+i*8,46);x.stroke()}};
    if(c==='Sunny')sun(32,26,12);else if(c==='Clear')moon(30,26,13);
    else if(c==='Mostly Sunny'){sun(26,22,10);cloud(36,32,'#e8eefc')}
    else if(c==='Partly Cloudy'){sun(22,18,9);cloud(34,28,'#e8eefc')}
    else if(c==='Cloudy'){cloud(24,22,'#aab6d0');cloud(34,30,'#e8eefc')}
    else if(c==='Showers'){cloud(30,20,'#c3cde4');rain()}
    else if(c==='T-Storms'){cloud(30,18,'#9aa6c0');x.fillStyle='#ffd21a';x.beginPath();x.moveTo(32,28);x.lineTo(24,40);x.lineTo(31,40);x.lineTo(26,51);x.lineTo(40,36);x.lineTo(33,36);x.lineTo(38,28);x.fill()}
    else if(c==='Snow'){cloud(30,20,'#e8eefc');x.fillStyle='#fff';for(let i=0;i<5;i++){x.beginPath();x.arc(16+i*8,40+(i%2)*6,2.5,0,7);x.fill()}}
    else if(c==='Fog'){x.strokeStyle='#cfd8ea';x.lineWidth=4;for(let i=0;i<4;i++){x.beginPath();x.moveTo(8+(i%2)*6,16+i*9);x.lineTo(56-(i%2)*6,16+i*9);x.stroke()}}
    else {cloud(30,22,'#e8eefc');x.strokeStyle='#a6d4ff';x.lineWidth=2;for(let i=0;i<3;i++){x.beginPath();x.moveTo(8,38+i*5);x.lineTo(50-i*8,38+i*5);x.stroke()}}
  });
}

/* ---------------- web requests through the Android app ---------------- */
let httpId=0;const httpWait={};
function http(url,headers){return new Promise((res,rej)=>{
  if(!NATIVE||!NATIVE.httpGet){rej(new Error('no network bridge'));return}
  const id=++httpId;httpWait[id]={res:res,rej:rej};
  setTimeout(()=>{if(httpWait[id]){delete httpWait[id];rej(new Error('timeout'))}},45000);
  NATIVE.httpGet(id,url,JSON.stringify(headers||{}));
})}
function httpDone(id,status){const w=httpWait[id];const body=NATIVE.takeResult(id);if(!w)return;delete httpWait[id];
  if(status>=200&&status<300)w.res(body);else w.rej(new Error('HTTP '+status))}

/* ---------------- local weather (National Weather Service, free) ---------------- */
const WXLOC={zip:'31909',lat:32.5466,lon:-84.9252,label:'Columbus, GA 31909'};
let WX=null,WXERR=null,WXAT=0;
const COMPASS=['N','NNE','NE','ENE','E','ESE','SE','SSE','S','SSW','SW','WSW','W','WNW','NW','NNW'];
function wxCat(s){s=(s||'').toLowerCase();
  if(/thunder|t-storm/.test(s))return 'T-Storms'; if(/snow|flurr|sleet|wintry/.test(s))return 'Snow';
  if(/shower|rain|drizzle/.test(s))return 'Showers'; if(/fog|haze|mist|smoke/.test(s))return 'Fog';
  if(/partly/.test(s))return 'Partly Cloudy'; if(/mostly clear/.test(s))return 'Clear'; if(/mostly sunny/.test(s))return 'Mostly Sunny';
  if(/mostly cloudy|overcast|cloudy/.test(s))return 'Cloudy'; if(/wind|breez|blustery/.test(s))return 'Breezy';
  if(/clear/.test(s))return 'Clear'; return 'Sunny'}
async function loadWeather(){
  if(!NATIVE)return;WXAT=Date.now();
  try{
    const pt=JSON.parse(await http('https://api.weather.gov/points/'+WXLOC.lat+','+WXLOC.lon)).properties;
    const per=JSON.parse(await http(pt.forecast)).properties.periods;
    let ob=null;
    try{const st=JSON.parse(await http(pt.observationStations));const sid=st.features[0].properties.stationIdentifier;
      ob=JSON.parse(await http('https://api.weather.gov/stations/'+sid+'/observations/latest')).properties}catch(e){}
    let alerts=[];
    try{const al=JSON.parse(await http('https://api.weather.gov/alerts/active?point='+WXLOC.lat+','+WXLOC.lon));
      alerts=(al.features||[]).map(f=>f.properties.event+(f.properties.headline?': '+f.properties.headline:''))}catch(e){}
    const num=v=>(v&&typeof v.value==='number')?v.value:null;
    const tC=ob&&num(ob.temperature);
    const p0=per[0];
    const now={
      temp:tC!=null?Math.round(tC*9/5+32):p0.temperature,
      cond:wxCat((ob&&ob.textDescription)||p0.shortForecast),
      hum:ob&&num(ob.relativeHumidity)!=null?Math.round(num(ob.relativeHumidity))+'%':'—',
      wind:(ob&&num(ob.windSpeed)!=null)?((num(ob.windSpeed)<1?'Calm':(num(ob.windDirection)!=null?COMPASS[Math.round(num(ob.windDirection)/22.5)%16]+' ':'')+Math.round(num(ob.windSpeed)*0.621)+' mph')):(p0.windDirection+' '+p0.windSpeed),
      baro:(ob&&num(ob.barometricPressure)!=null)?(num(ob.barometricPressure)*0.0002953).toFixed(2)+' in':'—'
    };
    const days=[];
    for(let i=0;i<per.length&&days.length<5;i++){const p=per[i];
      if(p.isDaytime){const night=per[i+1];days.push({name:days.length===0&&/today|this/i.test(p.name)?'Today':'#'+new Date(p.startTime).getDay(),hi:p.temperature,lo:night&&!night.isDaytime?night.temperature:null,cond:wxCat(p.shortForecast)})}
      else if(i===0){days.push({name:'Tonight',hi:null,lo:p.temperature,cond:wxCat(p.shortForecast)})}
    }
    const tick=alerts.map(a=>'⚠ '+a.toUpperCase()).concat(per.slice(0,3).map(p=>p.name.toUpperCase()+': '+p.detailedForecast));
    WX={now:now,days:days,ticker:tick,alerts:alerts.length,updated:Date.now()};WXERR=null;WXAT=Date.now();
  }catch(e){WXERR='Couldn’t reach the National Weather Service. Showing the last forecast.';WXAT=Date.now()-25*MIN}
  if(S.screen==='wx'||S.screen==='home')render();
}

  desc:ep.description&&ep.description!=='No information available'?ep.description:'',rating:ep.rating&&ep.rating!=='Not Rated'?ep.rating:'',isNew:false}}
async function plutoV2(start,stop){

  if(!Array.isArray(j)||!j.length)throw new Error('empty');

    .map(c=>({num:c.number,name:c.name,slug:c.slug,id:c._id||c.id,stitched:(c.stitched&&c.stitched.urls&&c.stitched.urls[0]&&c.stitched.urls[0].url)||'',progs:(c.timelines||[]).map(mapProg)}));

async function plutoV4(start){

  let chans=(cj.data||[]).filter(c=>c.number>0).sort((a,b)=>a.number-b.number).slice(0,SET.plutoCount);
  const byId={};chans.forEach(c=>byId[c.id]={num:c.number,name:c.name,slug:c.slug,id:c.id,progs:[]});

  }

function fillSched(progs,name){
  progs=progs.filter(p=>p.end>p.start).sort((a,b)=>a.start-b.start);

/* ---------------- updates from GitHub ---------------- */
const REPO='BBGINN77/cable-box';
const UPD={state:'idle',latest:0,url:null,checkedAt:0,pct:0};
function localBuild(){try{return NATIVE&&NATIVE.appVersion?NATIVE.appVersion():0}catch(e){return 0}}
function buildLabel(){const b=localBuild();return b>100?T('build {0}',b-100):T(NATIVE?'local build':'preview')}
async function checkUpdate(manual){
  if(!NATIVE){if(manual)dialog('Check for Updates','Updates are checked on your TV. This preview is always the newest version.',2600);return}
  if(manual)dialog('Check for Updates','<span class="wait"></span>Checking GitHub for a newer NyxVision…');
  try{
    const j=JSON.parse(await http('https://api.github.com/repos/'+REPO+'/releases/latest',{Accept:'application/vnd.github+json'}));
    const n=parseInt(String(j.tag_name||'').replace(/\D+/g,''),10)||0;
    const a=(j.assets||[]).find(x=>/\.apk$/i.test(x.name));
    UPD.latest=n?100+n:0;UPD.url=a?a.browser_download_url:null;UPD.checkedAt=Date.now();
    const have=localBuild();
    if(UPD.url&&UPD.latest>have){UPD.state='available';
      if(manual)askUpdate();
      else{let told=null;try{told=localStorage.getItem('cablebox-told')}catch(e){}
        if(told!==String(n)&&S.screen!=='egg'){try{localStorage.setItem('cablebox-told',String(n))}catch(e){}
          dialog('Update Available',T('A newer NyxVision (build {0}) is ready.',n)+'<small>Go to Settings → Check for Updates to install it.</small>',5000)}}}
    else{UPD.state='current';if(manual)dialog('Up to Date',T('You have the newest NyxVision ({0}).',buildLabel()),2600)}
  }catch(e){if(manual)dialog('Check for Updates','Couldn’t reach GitHub. Check the internet connection and try again.',3200)}
  if(S.screen==='set')render();
}
function askUpdate(){const n=UPD.latest-100;
  dialog('Update Available',T('NyxVision build {0} is ready (you have {1}).',n,buildLabel())+'<small>Press OK to download and install it, or BACK for later.</small>');S.dialog.onOk=startUpdate}
function startUpdate(){if(!UPD.url)return;UPD.state='downloading';UPD.pct=0;
  dialog('Updating NyxVision','<span class="wait"></span>'+T('Downloading… {0}%',0));try{NATIVE.installUpdate(UPD.url)}catch(e){updateState('error')}}
function updateProgress(p){UPD.pct=p;if(UPD.state==='downloading'&&S.dialog){S.dialog.body='<span class="wait"></span>'+T('Downloading… {0}%',p);render()}}
function updateState(st){
  if(st==='installing'){UPD.state='installing';dialog('Updating NyxVision',T('Android’s installer is opening. Choose {0} or {1}.','<b>'+T('Install')+'</b>','<b>'+T('Update')+'</b>')+'<small>NyxVision keeps your settings, favorites and last channel.</small>',7000)}
  else if(st==='permission'){UPD.state='permission';dialog('One-Time Permission',T('Turn on {0} for NyxVision, then press BACK. The update installs right after.','<b>'+T('Allow from this source')+'</b>')+'<small>This only lets NyxVision install its own updates. You can turn it off again later.</small>',12000)}
  else if(st==='error'){UPD.state='available';dialog('Update Didn’t Finish',T('The download was interrupted.')+'<small>Press OK to try again, or BACK to cancel.</small>');S.dialog.onOk=startUpdate}
}

  if(eh>1.5){x.fillStyle='#08080c';x.beginPath();x.ellipse(-8,-1,1.3,eh*.85,0,0,7);x.fill();x.beginPath();x.ellipse(8,-1,1.3,eh*.85,0,0,7);x.fill()}
  x.fillStyle=PINK;x.beginPath();x.moveTo(-2.6,7);x.lineTo(2.6,7);x.lineTo(0,9.6);x.fill();
  if(o.tongue>0){x.fillStyle='#e07a8a';x.beginPath();x.ellipse(0,12.5,2.6,1.5+o.tongue*3,0,0,7);x.fill()}
  x.strokeStyle='rgba(255,255,255,.75)';x.lineWidth=.8;[[-1,9.5],[-1,12],[1,9.5],[1,12]].forEach(([d,y])=>{x.beginPath();x.moveTo(d*6,y);x.lineTo(d*24,y+(y>10?2:-1));x.stroke()});
}
function catSit(x,cx,gy,s,o){x.save();x.translate(cx,gy);x.scale(s,s*(1-o.squash*.2));
  x.strokeStyle=POINT;x.lineWidth=9;x.lineCap='round';x.beginPath();x.moveTo(18,-6);x.quadraticCurveTo(52,-4,46+o.tail*4,-30-o.tail*12);x.stroke();
  x.fillStyle=SHADE;x.beginPath();x.ellipse(-15,-15,19,15,0,0,7);x.ellipse(15,-15,19,15,0,0,7);x.fill();
  const bg=x.createLinearGradient(-28,0,28,0);bg.addColorStop(0,SHADE);bg.addColorStop(.5,CREAM);bg.addColorStop(1,SHADE);x.fillStyle=bg;x.beginPath();x.ellipse(0,-42,25,40,0,0,7);x.fill();
  catLeg(x,-9,-48,-9,0);if(!o.paw)catLeg(x,9,-48,9,0);
  x.save();x.translate(0,-88+(o.headDy||0));x.rotate(o.headTilt||0);catHead(x,o);x.restore();
  if(o.paw)catLeg(x,9,-50,o.paw[0],o.paw[1]);
  x.restore()}
function catSide(x,cx,cy,s,dir,ang,legs,stretch){x.save();x.translate(cx,cy);x.scale(dir*s,s);x.rotate(ang);
  x.strokeStyle=POINT;x.lineWidth=8;x.lineCap='round';x.beginPath();x.moveTo(-32,-6);x.quadraticCurveTo(-60,-30+stretch*20,-74,-6+stretch*4);x.stroke();
  // legs: [backA, backB, frontA, frontB] offsets of paw x
  [[-22,legs[0]],[-14,legs[1]],[18,legs[2]],[26,legs[3]]].forEach(([hx2,sw])=>catLeg(x,hx2,0,hx2+sw,24-Math.abs(sw)*.25));
  const bg=x.createLinearGradient(0,-16,0,14);bg.addColorStop(0,SHADE);bg.addColorStop(.5,CREAM);bg.addColorStop(1,SHADE);x.fillStyle=bg;x.beginPath();x.ellipse(0,-2,36+stretch*6,15,0,0,7);x.fill();
  x.fillStyle='rgba(94,61,39,.35)';x.beginPath();x.ellipse(-24,-4,12,12,0,0,7);x.fill();
  x.save();x.translate(40+stretch*4,-14);x.scale(.72,.72);catHead(x,{blink:0,tongue:0});x.restore();
  x.restore()}
function eggScene(x,t){
  eggRoom(x,t);
  const FLOOR=470,TOP=262,X0=210,XT=452,X1=770,S1=1.25;
  const blink=((t%2.7)<.13)?1:0;
  const o={squash:0,paw:null,headTilt:0,headDy:0,blink:blink,tongue:0,tail:Math.sin(t*2.2)};
  const leap=(xa,ya,xb,yb,k,h)=>{const cx=lerp(xa,xb,k),cy=lerp(ya,yb,k)-Math.sin(k*Math.PI)*h;const dx=xb-xa,dy=(yb-ya)-h*Math.PI*Math.cos(k*Math.PI);
    const ang=Math.atan2(dy,dx)*.7;catSide(x,cx,cy-30,S1,1,ang,[-18,-24,22,28],Math.sin(k*Math.PI))};
  if(t<1.0)catSit(x,X0,FLOOR,S1,o);
  else if(t<1.4){o.squash=ease((t-1)/.4);catSit(x,X0,FLOOR,S1,o)}
  else if(t<2.2){eggOnce('c1',()=>eggSound('chirp'));leap(X0,FLOOR,XT,TOP,(t-1.4)/.8,130)}
  else if(t<2.5){eggOnce('t1',()=>eggSound('thump'));o.squash=1-ease((t-2.2)/.3);catSit(x,XT,TOP,S1,o)}
  else if(t<3.0)catSit(x,XT,TOP,S1,o);
  else if(t<6.4){const g=t-3.0,rest=[9,0],mouth=[5,-80];
    if(g<.3){o.paw=[lerp(rest[0],mouth[0],ease(g/.3)),lerp(rest[1],mouth[1],ease(g/.3))]}
    else if(g<1.9){o.paw=[mouth[0],mouth[1]+Math.sin(g*24)*2.5];o.headTilt=.16+Math.sin(g*12)*.05;o.headDy=4+Math.sin(g*12)*2;o.tongue=Math.max(0,Math.sin(g*24));o.blink=.6}
    else if(g<3.2){const P=[[5,-80],[18,-98],[12,-118],[-6,-110],[-2,-86],[5,-80]],ph=((g-1.9)%.65)/.65,seg=ph*(P.length-1),i=Math.min(P.length-2,Math.floor(seg)),f=ease(seg-i);
      o.paw=[lerp(P[i][0],P[i+1][0],f),lerp(P[i][1],P[i+1][1],f)];o.headTilt=.32;o.headDy=6;o.blink=.85}
    else{o.paw=[lerp(mouth[0],rest[0],ease((g-3.2)/.2)),lerp(mouth[1],rest[1],ease((g-3.2)/.2))]}
    catSit(x,XT,TOP,S1,o)}
  else if(t<7.4){eggOnce('m1',()=>eggSound('meow'));if(t>6.8&&t<7.15)o.blink=Math.sin((t-6.8)/.35*Math.PI);catSit(x,XT,TOP,S1,o)}
  else if(t<7.7){o.squash=ease((t-7.4)/.3);catSit(x,XT,TOP,S1,o)}
  else if(t<8.5){eggOnce('c2',()=>eggSound('chirp'));leap(XT,TOP,X1,FLOOR,(t-7.7)/.8,70)}
  else if(t<8.8){eggOnce('t2',()=>eggSound('thump'));o.squash=1-ease((t-8.5)/.3);catSit(x,X1,FLOOR,S1,o)}
  else{const cx=X1+(t-8.8)*200;
    x.fillStyle='rgba(30,18,10,.55)';for(let px=X1+30;px<Math.min(cx-20,960);px+=46){x.beginPath();x.arc(px,500+((px/46|0)%2)*10,5,0,7);x.fill()}
    if(cx<1080){const ph=t*11;catSide(x,cx,FLOOR-30,S1,1,0,[Math.sin(ph)*12,-Math.sin(ph)*12,-Math.sin(ph)*12,Math.sin(ph)*12],0)}}
  if(t>9.4){const a=Math.min(1,(t-9.4)/.8);x.globalAlpha=a;x.textAlign='center';x.font='italic 900 44px Archivo, Arial Black, sans-serif';x.fillStyle='#041040';x.fillText(T('Nyx was here.'),483,130);x.fillStyle='#fff';x.fillText(T('Nyx was here.'),480,127);
    x.font='700 16px "Archivo Narrow", Arial, sans-serif';x.fillStyle='#a6d4ff';x.fillText(T('Press any button'),480,160);x.globalAlpha=1}
}

/* ---------------- boot-up sequence (like powering on a 2004 cable box) ---------------- */
const BOOTSEQ={t0:0,pct:0,next:'watch'};
function bootHTML(){
  const cat=(hdr.toString().match(/<svg class="cat"[\s\S]*?<\/svg>/)||[''])[0];
  return '<div class="bg">'+bgDeco()+'</div><div class="boot"><div class="blogo">'+cat.replace('width="32" height="30"','width="96" height="90"')+'<div><b>NyxVision</b><span>DIGITAL CABLE</span></div></div>'+
    '<div class="bmsg" id="bmsg">'+T('Initializing\u2026')+'</div><div class="bbar"><div id="bbar"></div></div>'+
    '<div class="bfoot"><span>NyxVision DCT \u00B7 '+buildLabel()+'</span><span class="bled" id="bled">BOOT</span></div><div class="bskip">'+T('Press OK to skip')+'</div></div>';
}
function bootTick(){
  const t=(performance.now()-BOOTSEQ.t0)/1000;let msg,target;
  const ready=!NATIVE||CH.length>BASE||PLUTO_ERR||!SET.pluto;
  if(t<.9){msg=T('Initializing\u2026');target=8}
  else if(t<1.9){msg=T('Acquiring signal\u2026');target=22}
  else{target=ready?100:Math.min(92,22+(t-1.9)*12);BOOTSEQ.pct=Math.min(target,BOOTSEQ.pct+2.2);msg=T('Downloading program guide\u2026 {0}%',Math.round(BOOTSEQ.pct))}
  if(t<1.9)BOOTSEQ.pct=Math.min(target,BOOTSEQ.pct+1.2);
  if(BOOTSEQ.pct>=100&&t>3.4)msg=T('Welcome to NyxVision');
  const m=document.getElementById('bmsg'),b=document.getElementById('bbar'),l=document.getElementById('bled');
  if(m&&m.textContent!==msg)m.textContent=msg;if(b)b.style.width=BOOTSEQ.pct.toFixed(1)+'%';
  if(l){const d=new Date();l.textContent=t<1.9?'BOOT':t<3?'L-'+(1+Math.floor(t*2)%3):(d.getHours()%12||12)+(d.getSeconds()%2?':':' ')+pad(d.getMinutes())}
  if((BOOTSEQ.pct>=100&&t>4.1)||t>9)endBoot();
}
function endBoot(){if(S.screen!=='boot')return;S.screen=BOOTSEQ.next;if(S.screen==='watch'){S.bannerUntil=Date.now()+SET.bannerSec*1000;S.staticUntil=performance.now()+300}render();applyStream()}

/* ---------------- touch: tap, swipe, and a pop-up control bar (Android tablet) ---------------- */
const TOUCH=window.CableNative?!!(window.CableNative.isTouch&&window.CableNative.isTouch()):false;
const LISTS={home:()=>HOME,apps:()=>APPS,od:()=>OD,my:()=>CH,set:()=>SETS,more:()=>moreList(),themes:()=>themeList()};
let tdown=null,tbarT=0;
function showTbar(){const b=document.getElementById('tbar');if(!b||!TOUCH)return;b.classList.add('show');clearTimeout(tbarT);tbarT=setTimeout(()=>b.classList.remove('show'),4500)}
function tapAt(el,x){
  const sc=S.screen;
  if(sc==='boot'||sc==='egg'){press('ok');return}
  if(S.dialog){press(el.closest('.dlg')?'ok':'back');return}
  const fk=el.closest('[data-k]');if(fk){press(fk.dataset.k);return}
  if(sc==='watch'){if(el.closest('.rbot')){press('ok');return}if(el.closest('.banner')){press('guide');return}showTbar();press('info');return}
  if(sc==='wx'){press('back');return}
  if(sc==='home'){
    if(el.closest('.pv-slot')){snd.ok();go('watch');return}
    if(el.closest('.radar-slot')){const ri=CH.findIndex(c=>c.radar);snd.ok();if(ri>=0){S.screen='watch';tune(ri)}return}
    if(el.closest('.mini')){snd.ok();go('wx');return}
  }
  if(sc==='guide'&&S.g){
    if(el.closest('.pv-slot')){snd.ok();go('watch');return}
    const c=el.closest('[data-r]');if(!c)return;
    const r=+c.dataset.r,st=c.dataset.st?+c.dataset.st:Date.now(),f0=gFocus();
    const same=f0&&S.g.row===r&&c.classList.contains('hi');
    S.g.row=r;S.g.ft=Math.max(st,S.g.win);
    if(same||!c.dataset.st)press('ok');else{snd.nav();render()}return}
  const mi=el.closest('.mi[data-i]');
  if(mi&&LISTS[sc]){const i=+mi.dataset.i;S.idx[sc]=i;
    const v=el.closest('.v');
    if(v&&(sc==='set'||sc==='themes')){const b=v.getBoundingClientRect();press(x<b.left+b.width*.4?'left':'right');return}
    press('ok')}
}
function swipe(dx,dy){
  const sc=S.screen,v=Math.abs(dy)>Math.abs(dx);
  if(sc==='watch'){showTbar();press(v?(dy<0?'up':'down'):(dx<0?'right':'left'));return}
  if(sc==='guide'){press(v?(dy<0?'chdn':'chup'):(dx<0?'right':'left'));return}
  if(LISTS[sc]&&v){press(dy<0?'chdn':'chup');return}
  if(!v&&dx>0&&sc!=='home')press('back');
}
stage.addEventListener('pointerdown',e=>{tdown={x:e.clientX,y:e.clientY,el:e.target,t:Date.now()}});
stage.addEventListener('pointerup',e=>{if(!tdown)return;const dx=e.clientX-tdown.x,dy=e.clientY-tdown.y,el=tdown.el;tdown=null;
  const k=stage.getBoundingClientRect().width/960,lim=50*Math.max(k,.6);
  try{if(AC&&AC.state==='suspended')AC.resume()}catch(e2){}
  if(Math.abs(dx)>lim||Math.abs(dy)>lim)swipe(dx,dy);else tapAt(el,e.clientX)});
if(TOUCH){document.documentElement.classList.add('touch');
  const tb=document.createElement('div');tb.id='tbar';
  tb.innerHTML=[['menu','☰','Menu'],['guide','▦','Guide'],['chup','▲','CH'],['chdn','▼','CH'],['last','↺','Last'],['fav','★','Fav']]
    .map(b=>'<button type="button" data-k="'+b[0]+'"><b>'+b[1]+'</b><span>'+b[2]+'</span></button>').join('');
  tb.addEventListener('click',e=>{const b=e.target.closest('button');if(b){press(b.dataset.k);showTbar()}});
  screenEl.appendChild(tb)}

/* reminders: pop up when a reminded show starts */
function checkReminders(){
  const now=Date.now();
  S.reminders.forEach(key=>{const parts=key.split(':'),ci=+parts[0],st=+parts[1];
    if(st<=now&&now-st<10*MIN&&CH[ci]){S.reminders.delete(key);const p=progAt(ci,st);
      dialog('Starting Now',T('{0} is starting on Ch {1}.','<b>'+esc(p.title)+'</b>',CH[ci].n+' '+esc(CH[ci].call))+'<small>Press OK to watch, or BACK to dismiss.</small>');snd.ok();
      S.dialog.onOk=()=>{if(CH[ci].pluto&&SET.plutoPlay!=='box')launchPluto(ci);else{S.screen='watch';tune(ci)}}}
    else if(st<now-10*MIN)S.reminders.delete(key)});
}
setInterval(()=>{checkReminders();if(NATIVE&&UPD.checkedAt&&Date.now()-UPD.checkedAt>12*3600000)checkUpdate(false);if(new Date().toDateString()!==THEME_DAY){applyTheme();render()}if(NATIVE){if(Date.now()-WXAT>30*MIN)loadWeather();if(Date.now()-PLUTOAT>2*3600000)loadPluto()}},20000);

applyTheme();
/* Android TV integration: the app forwards remote buttons here */
if(NATIVE){document.documentElement.classList.add('tv');loadInstalled();}
BOOTSEQ.next=NATIVE?'watch':'home';BOOTSEQ.t0=performance.now();S.screen='boot';document.documentElement.lang=SET.lang||'en';
window.cable={
  press:press,
  httpDone:httpDone,
  playerState:playerState,
  updateProgress:updateProgress,
  updateState:updateState,
  jazzNative:function(st){jazzNative(st)},
  egg:function(){startEgg()},
  pause:function(){APP_PAUSED=true;updateJazz()},
  themeFor:function(y,m,d){const t=pickTheme(new Date(y,m-1,d));return t?t.id:null},
  resume:function(){APP_PAUSED=false;applyTheme();PLAY.on=false;PLAY.ready=false;PLAY.ci=-1;loadInstalled();if(S.screen==='watch')S.bannerUntil=Date.now()+SET.bannerSec*1000;S.staticUntil=performance.now()+260;render();fit();
    if(NATIVE){if(Date.now()-WXAT>30*MIN)loadWeather();if(Date.now()-PLUTOAT>2*3600000)loadPluto()}
    applyStream()}
};
render();
if(NATIVE){loadWeather();loadPluto();setTimeout(()=>checkUpdate(false),15000);
  setTimeout(()=>{if(NATIVE.jazzPlay&&!(NATIVE.jazzReady&&NATIVE.jazzReady())&&!JAZZ.rendering){const w=JAZZ.nWant;JAZZ.nWant=false;nativeJazzOn().then(()=>{if(JAZZ.nState==='preparing')JAZZ.nState='';JAZZ.nWant=JAZZ.nWant||w})}},30000)}
})();
